[project]
name = "praxis-train"
version = "0.1.0"
description = "Praxis Chess — evidence-grounded mistake explanation: dataset, LoRA training, export."
requires-python = ">=3.12,<3.13"

# Phase 1 is a toolchain spike: prove data -> LoRA -> GGUF -> Ollama -> UI on a
# 4 GB RTX 3050. Versions are pinned in uv.lock, not here, so a resolution can be
# reproduced exactly (`uv sync --frozen`) while this file stays readable.
dependencies = [
    "torch>=2.6",
    "transformers>=4.57",
    "accelerate>=1.0",
    "peft>=0.14",
    "trl>=0.13",
    "datasets>=3.0",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "python-chess>=1.11",
    "zstandard>=0.23",
    "pyyaml>=6.0",
    "huggingface-hub>=0.28",
]

[project.optional-dependencies]
# Unsloth is the plan's training path (§12). It is optional here because Phase 1
# must not be blocked on a third-party kernel package supporting a brand-new
# architecture; see README "Deviations".
unsloth = ["unsloth>=2025.1", "unsloth-zoo", "bitsandbytes", "xformers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis_train"]
