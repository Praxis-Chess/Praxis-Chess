name: E2E

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/e2e.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/e2e.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  e2e:
    name: Playwright (mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # No services block on purpose. The mocked suite intercepts every /api call
    # in the browser, so it needs neither PostgreSQL, nor Ollama, nor Stockfish,
    # nor the Spring backend. That is the whole reason the split exists: the
    # suite that runs on every push must not depend on four processes.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck the app
        run: npm run build

      - name: Typecheck the e2e suite
        # Fixtures are typed with the app's own interfaces, so this catches a
        # contract drift before a single browser starts.
        run: npm run test:e2e:types

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
