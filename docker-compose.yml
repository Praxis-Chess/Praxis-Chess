services:
  postgres:
    image: postgres:17-alpine
    container_name: praxis-chess-postgres
    restart: unless-stopped
    ports:
      # Loopback only. Published on every interface, anyone on the same network
      # could reach the database — and the fallback password below is public.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: praxis_chess_user
      # From .env (gitignored; see .env.example). The fallback is a public dev
      # default, acceptable only because the port above is loopback-only.
      # Takes effect when the data volume is first created — see README
      # "Changing the database password" for an existing database.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-praxis_chess_pass}
      POSTGRES_DB: praxis_chess
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxis_chess_user -d praxis_chess"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Search backend for Prax's web research. Behind a profile, so the ordinary
  #   docker compose up -d
  # still starts only PostgreSQL. Start this one explicitly:
  #   docker compose up -d searxng
  #
  # Self-hosted on purpose: no API key, and no third party learns what the
  # player asks about. Set praxis-chess.web.enabled=true to actually use it.
  searxng:
    image: searxng/searxng:latest
    container_name: praxis-chess-searxng
    profiles: ["web"]
    restart: unless-stopped
    ports:
      # Bound to loopback. This instance has no authentication and must not be
      # reachable from the network.
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
