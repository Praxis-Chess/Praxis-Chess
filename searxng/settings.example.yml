# SearXNG configuration for Praxis Chess.
#
# The one setting that matters: `formats` must include `json`. SearXNG serves
# HTML only by default and answers every API request with 403 — which looks
# exactly like a network failure and is the first thing to check if web research
# returns nothing.
#
# This instance is bound to localhost and used by one process, so the limiter is
# off; leaving it on rate-limits our own backend as if it were a scraper.

use_default_settings: true

server:
  # Generated per install by infra-up.sh (settings.yml is gitignored).
  # To rotate: delete searxng/settings.yml and run ./infra-up.sh again.
  secret_key: "__GENERATED_ON_FIRST_RUN__"
  limiter: false
  image_proxy: false

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

ui:
  static_use_hash: true

engines:
  # Chess questions are answered well by general encyclopaedic sources; the
  # defaults are fine. Engines are left at SearXNG's own defaults so this file
  # stays small and does not rot as they change upstream.
  - name: wikipedia
    disabled: false
