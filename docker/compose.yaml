# Praxis Chess — the whole app in Docker.
#
#   docker compose -f docker/compose.yaml up -d            prebuilt images
#   docker compose -f docker/compose.yaml up -d --build    build from this clone
#
# Then open http://localhost:8086 and enter your Chess.com username in Settings.
# The first start downloads the AI models (~8–9 GB); the app shows progress.
#
# Optional settings live in docker/.env (copy docker/.env.example). Add-ons:
#   NVIDIA GPU         -f docker/compose.gpu.yaml
#   Ollama on the host -f docker/compose.host-ollama.yaml   (Mac: always)
#
# Backups run by themselves into backups/ (see the backup service below).
#
# Separate from the developer stack in ../docker-compose.yml: its own project
# name, containers and volumes, so both can exist on one machine. Only the app
# is published, and only on 127.0.0.1; everything else stays on the internal
# network.

name: praxis

x-models: &models
  PRAXIS_MOVE_MODEL: ${PRAXIS_MOVE_MODEL:-qwen3:4b-instruct}
  PRAXIS_REPORT_MODEL: ${PRAXIS_REPORT_MODEL:-qwen3:4b-instruct}
  PRAXIS_REASONING_MODEL: ${PRAXIS_REASONING_MODEL:-qwen3:4b-instruct}
  # No colon on purpose: unset means the default, empty means "off".
  PRAXIS_COMMENTARY_MODEL: ${PRAXIS_COMMENTARY_MODEL-praxis-grid-2b-r3}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: praxis_chess_user
      # Not published to the host, so the default only matters inside this
      # stack. Set POSTGRES_PASSWORD in docker/.env before the first start to
      # choose your own.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-praxis_chess_pass}
      POSTGRES_DB: praxis_chess
    volumes:
      - praxis_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxis_chess_user -d praxis_chess"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    restart: unless-stopped
    volumes:
      - praxis_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: pulls the configured models and builds the trained commentary
  # model from Hugging Face, then exits. Re-runs skip what is already there.
  models:
    image: ghcr.io/praxis-chess/praxis-chess-models:${PRAXIS_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/models/Dockerfile
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      <<: *models
      OLLAMA_HOST: ${PRAXIS_OLLAMA_URL:-http://ollama:11434}
      PRAXIS_SETUP_DIR: /setup
    volumes:
      - praxis_setup:/setup

  app:
    image: ghcr.io/praxis-chess/praxis-chess:${PRAXIS_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # Starts without waiting for the models: the UI shows download progress
    # and works for everything that needs no model (sync, engine analysis).
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PRAXIS_PORT:-8086}:8086"
    environment:
      <<: *models
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-praxis_chess_pass}
      PRAXIS_OLLAMA_URL: ${PRAXIS_OLLAMA_URL:-http://ollama:11434}
      PRAXIS_SETUP_DIR: /setup
      CHESS_COM_USERNAME: ${CHESS_COM_USERNAME:-}
      PRAXIS_VOICE: ${PRAXIS_VOICE:-false}
      PRAXIS_WEB: ${PRAXIS_WEB:-false}
      TZ: ${TZ:-}
    volumes:
      - praxis_setup:/setup:ro
      # Read-only: the app shows the backups and asks for one through
      # /backup-requests; only the backup service writes snapshots.
      - ${PRAXIS_BACKUP_DIR:-../backups}:/backups:ro
      - praxis_backup_requests:/backup-requests

  # ── optional ───────────────────────────────────────────────────────────────

  # Prax's voice (Kokoro-82M on CPU). Enable with COMPOSE_PROFILES=voice and
  # PRAXIS_VOICE=true in docker/.env.
  voice:
    image: ghcr.io/praxis-chess/praxis-chess-voice:${PRAXIS_VERSION:-latest}
    build:
      context: ../tts-service
    profiles: ["voice"]
    restart: unless-stopped

  # Web research for Ask Prax (general chess questions only). Enable with
  # COMPOSE_PROFILES=web and PRAXIS_WEB=true in docker/.env.
  searxng:
    image: searxng/searxng:latest
    profiles: ["web"]
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      # Overrides secret_key in the mounted settings. The instance is not
      # published, but set your own in docker/.env anyway.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-praxis-change-me}
    volumes:
      - ../searxng/settings.example.yml:/etc/searxng/settings.yml:ro

  # Automatic backups into backups/ (repository root), or PRAXIS_BACKUP_DIR:
  # a snapshot when the last check is over 24 hours old (checked hourly; an
  # unchanged database writes nothing), "Back up now" from Settings, and a
  # weekly test restore. Snapshots are never deleted. See docker/INSTALL.md.
  #   docker compose -f docker/compose.yaml exec backup backup snapshot
  #   docker/backup/restore.sh <file>
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: praxis_chess_user
      PGPASSWORD: ${POSTGRES_PASSWORD:-praxis_chess_pass}
      PGDATABASE: praxis_chess
      REQUESTS_DIR: /backup-requests
      PRAXIS_VERSION: ${PRAXIS_VERSION:-}
      TZ: ${TZ:-}
    volumes:
      - ${PRAXIS_BACKUP_DIR:-../backups}:/backups
      - ./backup:/opt/praxis-backup:ro
      - praxis_backup_requests:/backup-requests
    entrypoint: ["bash", "/opt/praxis-backup/backup.sh", "daemon"]

volumes:
  praxis_db:
  praxis_models:
  praxis_setup:
  praxis_backup_requests:
