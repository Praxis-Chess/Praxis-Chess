name: Docker

# Pull requests and main: build the app image and smoke-test it with
# PostgreSQL (no models — the setup checklist must say so, not crash).
# A version tag (v1.3.0): also build every image for amd64 and arm64 on native
# runners and publish to ghcr.io/praxis-chess.
#
# No secret reaches a registry. Every image is scanned by docker/scan-image.sh
# BEFORE it is pushed (a registry keeps layers even after a tag is deleted, so
# afterwards is too late): secret-shaped files, the JAR's contents, image
# environment and labels, every layer's build command, and gitleaks over the
# whole filesystem. On every PR a decoy application.yml holding a canary
# string is planted where a developer's real one lives, and the build must
# come out without it — the proof that .dockerignore still does its job.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['backend/**', 'frontend/**', 'docker/**', 'tts-service/**', '.github/workflows/docker.yml', '.dockerignore']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'docker/**', 'tts-service/**', '.github/workflows/docker.yml', '.dockerignore']
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/praxis-chess
  GITLEAKS_VERSION: 8.30.1

jobs:
  smoke:
    name: Build and smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Config in step with the example
        run: python3 docker/check-config.py

      - name: Install gitleaks (checksum-verified)
        run: |
          case "$(uname -m)" in x86_64) arch=x64 ;; aarch64) arch=arm64 ;; *) echo "unsupported $(uname -m)"; exit 1 ;; esac
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "$tarball" gitleaks && sudo mv gitleaks /usr/local/bin/

      - name: Plant a decoy secret where a developer's real config lives
        id: canary
        run: |
          canary="praxis-canary-$(openssl rand -hex 12)"
          mkdir -p backend/src/main/resources
          printf 'praxis-chess:\n  ai:\n    cloud:\n      api-key: %s\n' "$canary" > backend/src/main/resources/application.yml
          printf 'PRAXIS_AI_API_KEY=%s\n' "$canary" > .env
          echo "value=$canary" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/praxis-chess:ci
          cache-from: type=gha,scope=app-amd64
          cache-to: type=gha,mode=max,scope=app-amd64

      - name: No secrets in the image, and the decoy stayed out
        run: bash docker/scan-image.sh ${{ env.REGISTRY }}/praxis-chess:ci "${{ steps.canary.outputs.value }}"

      - name: Remove the decoys
        run: rm -f backend/src/main/resources/application.yml .env

      - name: Start PostgreSQL and the app (no Ollama)
        env:
          PRAXIS_VERSION: ci
          # Nothing listens here: the checklist must report the models missing.
          PRAXIS_OLLAMA_URL: http://127.0.0.1:1
        run: |
          docker compose -f docker/compose.yaml up -d --no-build postgres app
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8086/actuator/health >/dev/null 2>&1 && break
            sleep 3
          done
          curl -fsS http://127.0.0.1:8086/actuator/health

      - name: Checklist reports what a fresh install has and lacks
        run: |
          s=$(curl -fsS http://127.0.0.1:8086/api/setup/status)
          echo "$s" | jq .
          state() { echo "$s" | jq -r --arg k "$1" '.checks[] | select(.key == $k) | .state'; }
          test "$(state database)" = OK
          test "$(state stockfish)" = OK
          echo "$s" | jq -e '.stockfish | startswith("Stockfish")'
          test "$(state username)" = FAIL
          test "$(state ollama)" = WARN
          echo "$s" | jq -e '.models | length == 3'

      - name: The UI is served, deep links included
        run: |
          curl -fsS http://127.0.0.1:8086/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8086/progress | grep -q '<div id="root">'

      - name: Sync is refused until a username is set
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8086/api/sync \
                   -H 'Content-Type: application/json' -d '{"months":1}')
          test "$code" = 409

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker/compose.yaml logs --no-color app postgres | tail -200

  # ── publish on a version tag ───────────────────────────────────────────────
  # Tag pushes do not trigger secret-scan.yml, so the release re-runs its
  # commit scan here and nothing is built for publishing until it passes.
  repo-secrets:
    name: Commit history has no secrets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        run: |
          case "$(uname -m)" in x86_64) arch=x64 ;; aarch64) arch=arm64 ;; *) echo "unsupported $(uname -m)"; exit 1 ;; esac
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "$tarball" gitleaks && sudo mv gitleaks /usr/local/bin/

      - name: Scan commits since the audited baseline
        run: gitleaks git --log-opts="2139c14b7ba4addecbcab9cb634d6a5ad6c03f72..HEAD" --redact --verbose .

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke, repo-secrets]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: [praxis-chess, praxis-chess-models, praxis-chess-voice]
        include:
          - image: praxis-chess
            context: .
            file: docker/Dockerfile
          - image: praxis-chess-models
            context: .
            file: docker/models/Dockerfile
          - image: praxis-chess-voice
            context: tts-service
            file: tts-service/Dockerfile
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks (checksum-verified)
        run: |
          case "$(uname -m)" in x86_64) arch=x64 ;; aarch64) arch=arm64 ;; *) echo "unsupported $(uname -m)"; exit 1 ;; esac
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "$tarball" gitleaks && sudo mv gitleaks /usr/local/bin/
      - uses: docker/setup-buildx-action@v3
      - name: Build locally first
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: scan/${{ matrix.image }}:${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Scan before anything is pushed
        run: bash docker/scan-image.sh scan/${{ matrix.image }}:${{ matrix.arch }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the scanned build by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [praxis-chess, praxis-chess-models, praxis-chess-voice]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: One multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ matrix.image }}@sha256:%s ' *)
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
