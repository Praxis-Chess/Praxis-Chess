name: Secret scan

# Runs the gitleaks CLI directly. The gitleaks GitHub Action needs a licence key
# for repositories owned by an organisation; the CLI does not.
#
# Scans every commit AFTER the baseline below. History before it was audited by
# hand when the repo went public (2026-09-22); the secrets found there were
# rotated or neutralised (SearXNG key regenerated, database port bound to
# loopback), so scanning them again would only keep CI red for dead values.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  BASELINE: 2139c14b7ba4addecbcab9cb634d6a5ad6c03f72

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the commit range needs history

      - name: Install gitleaks (checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan commits since the baseline
        run: gitleaks git --log-opts="${BASELINE}..HEAD" --redact --verbose .
